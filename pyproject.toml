[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sudregex"
version = "0.1.8"
description = "Regex-driven extraction with negation for clinical text (SUD-focused)."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Quantitative Nurse Lab", email = "quantitativenurse@gmail.com" }]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.21",
  "pandarallel>=1.6",
  "joblib>=1.3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
  "black==25.1.0",
  "flake8==7.3.0",
  "isort==6.0.1",
  "pytest",
  "build",
  "twine",
]
viz = ["matplotlib>=3.6"]
yaml = ["pyyaml>=6"]
spark = ["pyspark>=3.4", "pyarrow>=15.0"]
all = ["matplotlib>=3.6", "pyyaml>=6", "pyspark>=3.4","pyarrow>=15.0"]  # optional extras
[project.scripts]
sudregex = "sudregex.cli:main"

[project.urls]
Homepage = "https://github.com/quantitativenurse/sud-regex"
Issues = "https://github.com/quantitativenurse/sud-regex/issues"

[tool.setuptools.packages.find]
include = ["sudregex*"]

[tool.black]
line-length = 120
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | __pycache__
  | \.pytest_cache
  | \.mypy_cache
  | testing
  | .*\.ipynb
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = [".venv", "build", "dist", "testing"]

[tool.flake8]
max-line-length = 120
extend-ignore = [
  "E203",
  "W503",
]
per-file-ignores = [
  "sudregex/pattern_library.py:E501",
]
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "build",
  "dist",
  ".pytest_cache",
  ".mypy_cache",
  "testing",
]